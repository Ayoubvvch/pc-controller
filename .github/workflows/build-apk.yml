name: Build Android APK & Release Server

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Package Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk PCRemote-v2.0.9.apk

      - name: Package Windows Server Bundle
        run: |
          zip -r pc-controller-server-windows.zip server -x "server/*.log" "server/__pycache__/*" "server/screenshots/*" "server/*.pyc" "server/power_timer.json" "server/clipboard_history.json"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-APK
          path: PCRemote-v2.0.9.apk

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PC-Controller-Server
          path: pc-controller-server-windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.9
          name: "PC Remote v2.0.9"
          body: |
            ### 🚀 PC Remote Control (Release v2.0.9)

            #### 📦 Downloads
            * **📱 For Android Phones:** Download **`PCRemote-v2.0.9.apk`** below and install on your phone.
            * **💻 For Windows PCs:** Download **`pc-controller-server-windows.zip`** below, extract anywhere, and double-click **`start.bat`**.

            ---

            #### ✨ What's New in v2.0.9:
            * 🔊 **Hardware Volume Buttons Control PC:**
              * Use your phone's physical side buttons (Volume Up / Down) to directly adjust your Windows PC master volume while inside the app!
              * Sleek animated on-screen Volume HUD showing the current PC volume level and progress bar.
              * Consumes hardware key events so your phone's ringtone and media volume remain unaffected.
              * Settings toggle: "Phone Volume Keys Control PC" (enabled by default).
            * 🚀 **In-App Direct Download & Auto-Install:**
              * Checking for updates in Settings now downloads the new APK directly inside the app with a live progress dialog showing percentage and MB.
              * Automatically prompts the Android package installer when the download completes — no browser redirects needed!
            * ⚡ **Atomic Relative Volume API:**
              * Server `/api/volume` now supports atomic relative volume adjustments (`delta`), plus chat commands `+`, `-`, `s +5`, `s -5`.
          files: |
            PCRemote-v2.0.9.apk
            pc-controller-server-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
