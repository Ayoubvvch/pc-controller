name: Build Android APK & Release Server

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Package Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk PCRemote-v2.0.7.apk

      - name: Package Windows Server Bundle
        run: |
          zip -r pc-controller-server-windows.zip server -x "server/*.log" "server/__pycache__/*" "server/screenshots/*" "server/*.pyc" "server/power_timer.json"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-APK
          path: PCRemote-v2.0.7.apk

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PC-Controller-Server
          path: pc-controller-server-windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.7
          name: "PC Remote v2.0.7"
          body: |
            ### 🚀 PC Remote Control (Release v2.0.7)

            #### 📦 Downloads
            * **📱 For Android Phones:** Download **`PCRemote-v2.0.7.apk`** below and install on your phone.
            * **💻 For Windows PCs:** Download **`pc-controller-server-windows.zip`** below, extract anywhere, and double-click **`start.bat`**.

            ---

            #### ✨ What's New in v2.0.7:
            * ⚡ **Notification Clipboard Sync Fix:**
              * Resolved the Android 10+ window focus issue where tapping "Send Clipboard" in the notification bar reported "Phone clipboard is empty".
              * Now automatically closes system dialogs, acquires window focus, and seamlessly extracts and sends copied text to PC.
            * 🔑 **Permanent Keystore & In-Place Updates:**
              * Signed with the permanent cryptographic keystore (`release.keystore`). Seamlessly update directly over existing versions without uninstalling.
            * 🔄 **Persistent Background Service:**
              * Keep active in background toggle in Settings with persistent notification bar controller.
            * 🚀 **In-App Update Checker:**
              * Check for updates directly inside Settings.
          files: |
            PCRemote-v2.0.7.apk
            pc-controller-server-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
