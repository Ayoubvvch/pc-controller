name: Build Android APK & Release Server

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Package Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk PCRemote-v2.2.1.apk

      - name: Package Windows Server Bundle
        run: |
          zip -r pc-controller-server-windows.zip server -x "server/*.log" "server/__pycache__/*" "server/screenshots/*" "server/*.pyc" "server/power_timer.json" "server/clipboard_history.json" "server/authorized_devices.json" "server/last_loop_video.txt"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-APK
          path: PCRemote-v2.2.1.apk

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PC-Controller-Server
          path: pc-controller-server-windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.2.1
          name: "PC Remote v2.2.1"
          body: |
            ### 🚀 PC Remote Control (Release v2.2.1 - Universal Video Looper)

            #### 📦 Downloads
            * **📱 For Android Phones:** Download **`PCRemote-v2.2.1.apk`** below and install on your phone.
            * **💻 For Windows PCs:** Download **`pc-controller-server-windows.zip`** below, extract anywhere, and double-click **`start.bat`**.

            ---

            #### 🎬 What's New in v2.2.1:
            * 🎬 **Universal Video Looper:**
              * Generalizes the legacy loop player into a universal video looper maintaining full fidelity: Fullscreen (`--fs`), Infinite Loop (`--loop-file=inf`), and Master Volume at 16%.
              * **Browse & Loop from PC Files:** Tap any video file (`.mp4`, `.mkv`, `.mov`, `.avi`, `.webm`, etc.) in the PC File Explorer to immediately launch it in loop mode on the PC.
              * **Direct Video Upload & Loop:** Send any video file from your phone gallery/storage to PC; it uploads and immediately starts playing in fullscreen loop at 16% volume.
              * **Top Bar Quick Action Chip (`🎬 Loop Video`):** One-tap modal to browse PC files, upload from phone, replay last video, or stop playback.
              * **Chat Command Support:** Type `loop <path_or_filename>` or bare `loop` to replay the last video, and `stop` / `close` to exit.
            * 🔒 **All v2.2.0 Security & Pairing features preserved and verified.**
          files: |
            PCRemote-v2.2.1.apk
            pc-controller-server-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
