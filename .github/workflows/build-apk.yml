name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk PCRemote-v2.0.1.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-APK
          path: PCRemote-v2.0.1.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.1
          name: "PC Remote App v2.0.1"
          body: |
            ### 🚀 PC Remote Control Android App (Release v2.0.1)
            - 🔊 **إصلاح وتحسين شريط التحكم في الصوت (Volume Slider):**
              - ظهور شريط الصوت تلقائياً وفورياً عند إرسال أمر `sound` أو `vol`.
              - شريط تحكم مدمج داخل المحادثة ولوحة تحكم سريعة (Bottom Sheet) مع أزرار النسب المئوية (15%, 30%, 50%, 75%, 100%) وزر كتم الصوت.
            - 🔍 **تكبير ومعاينة لقطات الشاشة بدقة عالية (Pinch-to-Zoom & Pan):**
              - دعم كامل للتكبير باللمس (Pinch-to-zoom) حتى 5 أضعاف، والتحريك السلس، والنقر المزدوج (Double-tap) للتكبير التلقائي وإعادة الضبط.
            - 🖼️ **فتح لقطات الشاشة مباشرة في معرض الصور (Open in Gallery):**
              - زر سريع لفتح لقطة الشاشة في تطبيق المعرض المفضل في هاتفك بدون أي تعقيد.
            - 📥 **تحميل وحفظ لقطات الشاشة في الهاتف (Save to Downloads):**
              - حفظ فوري ومباشر في مجلد Downloads مع تحديث فوري للمعرض.
            - 🛡️ **تطبيق نظيف وخفيف بدون روت:**
              - متصفح ملفات PC وسحب الملفات، أوامر الطاقة مع تأكيد الأمان ومؤقتات النوم.
          files: PCRemote-v2.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
