name: Build Android APK & Release Server

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Package Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk PCRemote-v2.0.5.apk

      - name: Package Windows Server Bundle
        run: |
          zip -r pc-controller-server-windows.zip server -x "server/*.log" "server/__pycache__/*" "server/screenshots/*" "server/*.pyc" "server/power_timer.json"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-APK
          path: PCRemote-v2.0.5.apk

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PC-Controller-Server
          path: pc-controller-server-windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.5
          name: "PC Remote v2.0.5"
          body: |
            ### 🚀 PC Remote Control (Release v2.0.5)

            #### 📦 Downloads
            * **📱 For Android Phones:** Download **`PCRemote-v2.0.5.apk`** below and install on your phone.
            * **💻 For Windows PCs:** Download **`pc-controller-server-windows.zip`** below, extract anywhere, and double-click **`start.bat`**.

            ---

            #### ✨ What's New in v2.0.5:
            * 📋 **Instant Clipboard Sync (Phone ➔ PC):**
              * Added dedicated **Clipboard button** (`📋`) directly in the message bar and top quick actions chips.
              * Convenient dialog allows pasting any text, URL, code snippet, or document text with one-click **"Paste from Phone"** button.
              * Text is instantly copied to your Windows PC clipboard via native Win32 API — ready to paste immediately (`Ctrl + V`) anywhere on your computer.
            * 💬 **Chat Clipboard Commands:**
              * You can now also type `clip <text>`, `copy <text>`, or `setclip <text>` directly into the command bar to copy to PC clipboard.
            * 🌐 **Full English Interface & Documentation:**
              * Completely localized mobile app UI, layout resources, server API responses, and setup guides.
            * ⚡ **Persistent Power Scheduler:**
              * Scheduled sleep/shutdown timers (`sleep 15m`, `shutdown 30m`) are preserved across screen locks (`Win + L`) and server restarts.
            * 🛠️ **Simplified One-Click Windows Tooling:**
              * `start.bat`, `stop.bat`, `status.bat`, and autostart installers.
          files: |
            PCRemote-v2.0.5.apk
            pc-controller-server-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
