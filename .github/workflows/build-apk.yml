name: Build Android APK & Release Server

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Package Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk PCRemote-v2.0.6.apk

      - name: Package Windows Server Bundle
        run: |
          zip -r pc-controller-server-windows.zip server -x "server/*.log" "server/__pycache__/*" "server/screenshots/*" "server/*.pyc" "server/power_timer.json"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-APK
          path: PCRemote-v2.0.6.apk

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PC-Controller-Server
          path: pc-controller-server-windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.6
          name: "PC Remote v2.0.6"
          body: |
            ### 🚀 PC Remote Control (Release v2.0.6)

            #### 📦 Downloads
            * **📱 For Android Phones:** Download **`PCRemote-v2.0.6.apk`** below and install on your phone.
            * **💻 For Windows PCs:** Download **`pc-controller-server-windows.zip`** below, extract anywhere, and double-click **`start.bat`**.

            ---

            #### ✨ What's New in v2.0.6:
            * 🔑 **Permanent Keystore & Seamless In-Place Updates:**
              * Built and signed with a permanent cryptographic release keystore (`release.keystore`).
              * **No more uninstalling required!** All future updates can be installed directly over existing versions with one tap.
            * 🔄 **Persistent Background Service & Notification:**
              * Added toggle in Settings: **"Keep Active in Background"**.
              * Displays a persistent status notification in Android's notification bar to prevent the system from killing the app.
              * Features a direct **"📋 Send Clipboard"** action button in the notification drawer to sync text to PC instantly from anywhere!
            * 🚀 **In-App Update Checker:**
              * Added **"Check for App Updates"** button in Settings with direct GitHub Releases integration and one-click download.
            * 📋 **Instant Clipboard Sync (Phone ➔ PC):**
              * Dedicated button in bottom bar, quick actions chip, transparent action activity, and chat commands (`clip <text>`, `copy <text>`).
            * 🌐 **Full English Interface & Documentation:**
              * 100% English UI, layouts, and server responses.
          files: |
            PCRemote-v2.0.6.apk
            pc-controller-server-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
