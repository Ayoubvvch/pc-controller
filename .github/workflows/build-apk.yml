name: Build Android APK & Release Server

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Package Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk PCRemote-v2.1.3.apk

      - name: Package Windows Server Bundle
        run: |
          zip -r pc-controller-server-windows.zip server -x "server/*.log" "server/__pycache__/*" "server/screenshots/*" "server/*.pyc" "server/power_timer.json" "server/clipboard_history.json"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-APK
          path: PCRemote-v2.1.3.apk

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PC-Controller-Server
          path: pc-controller-server-windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.1.3
          name: "PC Remote v2.1.3"
          body: |
            ### 🚀 PC Remote Control (Release v2.1.3 - Stability Update)

            #### 📦 Downloads
            * **📱 For Android Phones:** Download **`PCRemote-v2.1.3.apk`** below and install on your phone.
            * **💻 For Windows PCs:** Download **`pc-controller-server-windows.zip`** below, extract anywhere, and double-click **`start.bat`**.

            ---

            #### ✨ What's in v2.1.3:
            * 🛡️ **Complete Stability & Reliability Restoration:**
              * Reverted experimental priv-app background receivers and system media session.
              * Restored the rock-solid, battle-tested transparent focus mechanism for notification quick actions.
            * 📋 **Two-Way Instant Notification Clipboard Sync:**
              * **"📋 Send Clip"** & **"📥 Get PC Clip"** work flawlessly from anywhere (lock screen, browsers, YouTube, inside any app).
              * Reliable, fast, and 100% compatible across standard Android and custom ROMs.
            * 🔊 **Hardware Volume Control:**
              * Phone physical volume keys outside the app strictly control your phone's volume with 100% priority.
              * Inside the app, phone physical volume keys control PC volume with real-time HUD (when enabled).
          files: |
            PCRemote-v2.1.3.apk
            pc-controller-server-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
