name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk PCRemote-v2.0.2.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-APK
          path: PCRemote-v2.0.2.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.2
          name: "PC Remote App v2.0.2"
          body: |
            ### 🚀 PC Remote Control Android App (Release v2.0.2)
            - 🛡️ **نظام المرونة العالية والاكتشاف التلقائي (Zero-Config Auto-Discovery):**
              - لا حاجة لمعرفة أو تغيير عنوان IP يدوياً بعد اليوم عند انقطاع الإنترنت أو تغيّر عنوان الشبكة (DHCP).
              - اكتشاف تلقائي فائق السرعة عبر UDP Broadcast و Subnet Scan الذكي.
              - إعادة اتصال وتنفيذ تلقائي وفوري للأوامر عند انقطاع الشبكة دون أي تدخل من المستخدم.
              - زر بحث تلقائي مدمج داخل شاشة الإعدادات.
            - ⚡ **حماية الخادم على الحاسوب (24/7 Watchdog Service):**
              - خدمة مراقبة وإعادة تشغيل تلقائية لحماية السيرفر من التوقف عند إعادة تشغيل الحاسوب، السكون، أو تعطل الشبكة.
            - 🔊 **شريط تحكم الصوت الذكي:** تحكم فوري وتفاعلي بنسب مئوية وزر كتم الصوت.
            - 🔍 **لقطات الشاشة المطورة:** تكبير حتى 5 أضعاف باللمس، نقر مزدوج، فتح في المعرض، وتحميل فوري.
          files: PCRemote-v2.0.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
