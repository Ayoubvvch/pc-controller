name: Build Android APK & Release Server

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Package Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk PCRemote-v2.0.8.apk

      - name: Package Windows Server Bundle
        run: |
          zip -r pc-controller-server-windows.zip server -x "server/*.log" "server/__pycache__/*" "server/screenshots/*" "server/*.pyc" "server/power_timer.json" "server/clipboard_history.json"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-APK
          path: PCRemote-v2.0.8.apk

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PC-Controller-Server
          path: pc-controller-server-windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.8
          name: "PC Remote v2.0.8"
          body: |
            ### 🚀 PC Remote Control (Release v2.0.8)

            #### 📦 Downloads
            * **📱 For Android Phones:** Download **`PCRemote-v2.0.8.apk`** below and install on your phone.
            * **💻 For Windows PCs:** Download **`pc-controller-server-windows.zip`** below, extract anywhere, and double-click **`start.bat`**.

            ---

            #### ✨ What's New in v2.0.8:
            * 📋 **PC Clipboard History (Windows Win + V on Phone):**
              * Browse and search items previously copied on your Windows computer directly from your phone.
              * One tap to copy any PC history item to your phone's clipboard, or set it back as active on your PC.
              * Real-time background clipboard monitoring on Windows with zero external dependencies.
            * 📱 **Organized Top Header & "More" Menu (`⋮`):**
              * Decluttered header bar with an intuitive 3-dots menu consolidating PC Clipboard History, File Browser, Settings, and Connection Refresh.
              * Added quick `📋 Win+V History` chip for 1-tap access.
            * 🔑 **Permanent Keystore & In-Place Updates:**
              * Signed with the permanent cryptographic keystore (`release.keystore`). Update directly over existing versions without uninstalling.
          files: |
            PCRemote-v2.0.8.apk
            pc-controller-server-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
