name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk PCRemote-v2.0.3.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-APK
          path: PCRemote-v2.0.3.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.0.3
          name: "PC Remote App v2.0.3"
          body: |
            ### 🚀 PC Remote Control Android App (Release v2.0.3)
            - 🚀 **نقل الملفات المباشر عبر SSH في الخلفية (Direct SSH Background Transfer):**
              - عند تحميل أو سحب أي ملف من متصفح ملفات الحاسوب، يقوم الحاسوب بنقل الملف مباشرة إلى الهاتف عبر بروتوكول SSH في الخلفية.
              - لا حاجة لإبقاء التطبيق مفتوحاً؛ يمكنك إغلاق التطبيق أو قفل الشاشة بأمان تام بينما يستمر النقل في الخلفية دون انقطاع.
            - 🛡️ **نظام المرونة العالية والاكتشاف التلقائي (Zero-Config Auto-Discovery):**
              - اكتشاف تلقائي للـ IP عند انقطاع الإنترنت أو تغيّر الشبكة دون أي إعدادات يدوية.
            - ⚡ **حماية الخادم على الحاسوب (24/7 Watchdog Service):**
              - خدمة مراقبة وإعادة تشغيل تلقائية تضمن عمل السيرفر على مدار الساعة.
            - 🔊 **التحكم الذكي في الصوت ولقطات الشاشة المطورة بدعم التكبير والتنزيل.**
          files: PCRemote-v2.0.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
