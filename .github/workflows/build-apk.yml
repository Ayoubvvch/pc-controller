name: Build Android APK & Release Server

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Package Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk PCRemote-v2.2.0.apk

      - name: Package Windows Server Bundle
        run: |
          zip -r pc-controller-server-windows.zip server -x "server/*.log" "server/__pycache__/*" "server/screenshots/*" "server/*.pyc" "server/power_timer.json" "server/clipboard_history.json" "server/authorized_devices.json"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-APK
          path: PCRemote-v2.2.0.apk

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PC-Controller-Server
          path: pc-controller-server-windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.2.0
          name: "PC Remote v2.2.0"
          body: |
            ### 🚀 PC Remote Control (Release v2.2.0 - Security & Device Pairing)

            #### 📦 Downloads
            * **📱 For Android Phones:** Download **`PCRemote-v2.2.0.apk`** below and install on your phone.
            * **💻 For Windows PCs:** Download **`pc-controller-server-windows.zip`** below, extract anywhere, and double-click **`start.bat`**.

            ---

            #### 🛡️ What's New in v2.2.0:
            * 🔒 **One-Time Zero-Friction Device Pairing:**
              * Full protection against unauthorized access or spying from other devices on the same Wi-Fi network.
              * First-time connection displays a native Windows confirmation popup on your PC screen displaying the phone's device name and IP address.
              * Approving the device generates a secure 48-character cryptographic token permanently stored on both devices.
              * **Instant & Seamless:** Subsequent daily usage requires no prompts or passwords — requests are authenticated instantly via background header token.
            * 🚫 **Strict API Protection:**
              * All sensitive endpoints (screen capture, file browsing, downloads, clipboard history, power controls, commands) are protected against unauthenticated Wi-Fi users (`401 Unauthorized`).
            * 🔄 **Re-pair & Device Management:**
              * Easily re-pair or revoke authorization directly from the Settings dialog (**"🛡️ Re-pair Device with PC"**).
          files: |
            PCRemote-v2.2.0.apk
            pc-controller-server-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
