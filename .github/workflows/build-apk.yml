name: Build Android APK & Release Server

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Package Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk PCRemote-v2.3.0.apk

      - name: Package Windows Server Bundle
        run: |
          zip -r pc-controller-server-windows.zip server -x "server/*.log" "server/__pycache__/*" "server/screenshots/*" "server/*.pyc" "server/power_timer.json" "server/clipboard_history.json" "server/authorized_devices.json" "server/last_loop_video.txt"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-APK
          path: PCRemote-v2.3.0.apk

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PC-Controller-Server
          path: pc-controller-server-windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.3.0
          name: "PC Remote v2.3.0"
          body: |
            ### 🚀 PC Remote Control (Release v2.3.0 - Modern Material 3 UI Overhaul)

            #### 📦 Downloads
            * **📱 For Android Phones:** Download **`PCRemote-v2.3.0.apk`** below and install on your phone.
            * **💻 For Windows PCs:** Download **`pc-controller-server-windows.zip`** below, extract anywhere, and double-click **`start.bat`**.

            ---

            #### 🎨 What's New in v2.3.0:
            * 🎨 **Complete Modern Material 3 UI Overhaul:**
              * **Sleek Settings Bottom Sheet:** Upgraded from legacy dialog to an elegant slide-up BottomSheetDialog with rounded top corners (24dp), drag handle, and grouped Material cards for Connection, Preferences, Security/Pairing, and Updates.
              * **Quick Control Center (3-Dots Menu):** Replaced default Android PopupMenu with a rich, interactive Quick Action BottomSheet featuring custom icon circles, bold titles, and helpful descriptions.
              * **Midnight Cyber AMOLED Dark Theme:** Upgraded the entire color system with deep midnight surfaces (`#0B0F19`), elevated card surfaces (`#1A2438`), subtle hairline borders, and vivid electric cyan & emerald accents.
              * **Radiant Action Buttons:** Elevated top header action buttons and bottom command send button with modern gradients and tactile ripple feedback.
            * 🎬 **Universal Video Looper:** Fullscreen infinite video looper with 16% volume from PC files or mobile upload.
            * 🔒 **Zero-Friction Device Security & Cryptographic Pairing preserved.**
          files: |
            PCRemote-v2.3.0.apk
            pc-controller-server-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
