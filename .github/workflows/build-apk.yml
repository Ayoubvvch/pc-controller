name: Build Android APK & Release Server

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Package Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk PCRemote-v2.1.2.apk

      - name: Package Windows Server Bundle
        run: |
          zip -r pc-controller-server-windows.zip server -x "server/*.log" "server/__pycache__/*" "server/screenshots/*" "server/*.pyc" "server/power_timer.json" "server/clipboard_history.json"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-APK
          path: PCRemote-v2.1.2.apk

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PC-Controller-Server
          path: pc-controller-server-windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.1.2
          name: "PC Remote v2.1.2"
          body: |
            ### 🚀 PC Remote Control (Release v2.1.2)

            #### 📦 Downloads
            * **📱 For Android Phones:** Download **`PCRemote-v2.1.2.apk`** below and install on your phone.
            * **💻 For Windows PCs:** Download **`pc-controller-server-windows.zip`** below, extract anywhere, and double-click **`start.bat`**.

            ---

            #### ✨ What's New in v2.1.2:
            * ⭐ **Privileged Mode (`priv-app`) Support:**
              * Added an optional **"⭐ Privileged Mode (priv-app)"** toggle in Connection Settings.
              * Designed for advanced users who install the app into `/system/priv-app`. Normal users can keep it off with zero behavioral changes.
            * ⚡ **True 0.0s Zero-Lag Notification Clipboard Sync:**
              * When Privileged Mode is enabled, tapping **"📋 Send Clip"** or **"📥 Get PC Clip"** executes instantly via a direct background broadcast receiver.
              * Completely eliminates the transparent activity workaround, removing all screen flicker and focus delays for true instantaneous clipboard exchange.
              * Includes automatic fallback to transparent activity if background access is ever restricted.
            * 🎚️ **Native PC Volume Slider in Android System Volume Panel:**
              * Integrates a remote `MediaSessionCompat` + `VolumeProviderCompat` into Android's native expandable volume panel.
              * Adjust PC volume from outside the app by simply sliding the PC Volume bar in Android's volume panel (or media switcher).
              * **Hardware Key Safety:** Physical volume buttons outside the app strictly control your phone's volume (phone volume always takes priority outside the app).
              * Debounced (80ms) and synchronized in real-time with PC volume changes.
          files: |
            PCRemote-v2.1.2.apk
            pc-controller-server-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
