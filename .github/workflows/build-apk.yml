name: Build Android APK & Release Server

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Package Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk PCRemote-v2.1.1.apk

      - name: Package Windows Server Bundle
        run: |
          zip -r pc-controller-server-windows.zip server -x "server/*.log" "server/__pycache__/*" "server/screenshots/*" "server/*.pyc" "server/power_timer.json" "server/clipboard_history.json"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-APK
          path: PCRemote-v2.1.1.apk

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PC-Controller-Server
          path: pc-controller-server-windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.1.1
          name: "PC Remote v2.1.1"
          body: |
            ### 🚀 PC Remote Control (Release v2.1.1)

            #### 📦 Downloads
            * **📱 For Android Phones:** Download **`PCRemote-v2.1.1.apk`** below and install on your phone.
            * **💻 For Windows PCs:** Download **`pc-controller-server-windows.zip`** below, extract anywhere, and double-click **`start.bat`**.

            ---

            #### ✨ What's New in v2.1.1:
            * 📥 **Quick "Get PC Clip" Action in Persistent Notification:**
              * Added a dedicated **"📥 Get PC Clip"** quick action button right inside the persistent Android notification bar (next to "📋 Send Clip").
              * **Instant Reverse Sync:** Fetches whatever was copied on the PC (`Ctrl + C`) and immediately copies it into your phone's clipboard.
              * **Non-Intrusive & Fast:** Displays a brief Toast preview of the copied content and works seamlessly from anywhere (lock screen, inside other apps, browser).
              * Enables true two-way instant clipboard synchronization directly from the system notification bar with zero app opening!
            * 🛠️ **Refined Dual Notification Actions:**
              * Shortened button labels (`📋 Send Clip` & `📥 Get PC Clip`) to guarantee both actions fit perfectly on all screen widths without truncation.
          files: |
            PCRemote-v2.1.1.apk
            pc-controller-server-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
